{% extends 'base.html' %}
{% block title %}Verify Email | TravelSetu{% endblock %}
{% block content %}
<section class="container narrow section">
    <div class="panel">
        <h2>Verify your email</h2>
        <p class="muted">Enter the 6-digit verification code sent to <strong>{{ email }}</strong>.</p>
        <form method="post">
            <label for="otp">Verification code
                <input id="otp" name="otp" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
            </label>
            <button class="btn" type="submit">Verify Email</button>
        </form>
        <form method="post" action="{{ url_for('resend_otp', email=email) }}" class="mt-10">
            <button class="btn btn-outline" type="submit">Resend Verification Code</button>
        </form>
        <p class="muted">Check Inbox, Spam, and Promotions. The local test code is also printed in the Flask terminal.</p>
    </div>
</section>
{% endblock %}
